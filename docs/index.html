<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maria Elgart — Cloud & Infrastructure Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="wrapper">
    <div id="app">
      <div class="loading">
        <div class="spinner"></div>
        <span>LOADING PORTFOLIO</span>
      </div>
    </div>
  </div>

  <script>
    const API = "./cv.json";
    const DATA_SOURCE_LABEL = API.startsWith("http")
      ? "DEVOPS DEMO · GKE · HELM"
      : "GITHUB PAGES · STATIC HOSTING";

    const PRIMARY_SKILLS = ["Kubernetes", "Terraform", "AWS", "CI/CD", "ArgoCD"];
    const STRONG_SKILLS = ["GCP", "Helm", "Docker", "GitOps", "Terragrunt", "Python", "Jenkins"];

    const PROJECT_LINKS = {
        "FamilyBot": "https://github.com/masha-el/family-bot",
        "Corti":     "https://github.com/masha-el/corti-bot",
    };

    async function load() {
      try {
        const res = await fetch(API, { cache: "no-store" });
        if (!res.ok) throw new Error();
        const cv = await res.json();
        render(cv);
      } catch {
        document.getElementById("app").innerHTML =
          `<div class="error-block">⚠ Could not reach API at ${API}</div>`;
      }
    }

    function renderJob(job) {
      return `
        <div class="card">
          <div class="job-meta">
            <div>
              <div class="job-role">${job.role}</div>
              <div class="job-company">${job.company}</div>
            </div>
            <span class="job-period">${job.period}</span>
          </div>
          <ul class="highlights">
            ${job.highlights.map(h => `<li>${highlightNumbers(h)}</li>`).join("")}
          </ul>
        </div>`;
    }

    function render(cv) {
      const pinned  = cv.experience.slice(0, 3);
      const earlier = cv.experience.slice(3);

      const projects = (cv.projects || []).map(p =>{
        const linkKey = Object.keys(PROJECT_LINKS).find(k => p.name.includes(k));
        const githubLink = linkKey
            ? `<a class="project-link" href="${PROJECT_LINKS[linkKey]}" target="_blank">GitHub</a>`
            : "";
            return `
              <div class="card">
                <div class="project-name">${p.name}</div>
                <div class="project-links">${githubLink}</div>
                <ul class="highlights">
                  ${p.highlights.map(h => `<li>${h}</li>`).join("")}
                </ul>
              </div>`;
    }).join("");

      const languages = cv.languages.map(l =>
        `<span class="lang-tag">${l}</span>`
      ).join("");

      document.getElementById("app").innerHTML = `
        <header>
          <div class="header-top">
            <div class="profile-lockup">
              <img class="profile-photo" src="./assets/profile.jpg" alt="${cv.name}" />
              <div class="name-block">
                <h1>${cv.name}</h1>
                <div class="title">${cv.title}</div>
                <div class="positioning">I enjoy turning manual, fragile processes into automated and reliable systems. My work spans cloud infrastructure, Kubernetes, Terraform, and CI/CD, with a focus on helping teams spend less time operating systems and more time building products.</div>
              </div>
            </div>
          </div>
          <div class="contact-row">
            <span>${cv.contact.email}</span>
            <span>${cv.contact.phone}</span>
            <span>${cv.contact.location}</span>
          </div>
          <div class="cta-row">
            <a class="cta-btn primary" href="mailto:${cv.contact.email}">Contact me</a>
            <a class="cta-btn secondary" href="https://www.linkedin.com/in/mashaelgart" target="_blank">LinkedIn</a>
            <a class="cta-btn secondary" href="https://github.com/masha-el" target="_blank">GitHub</a>
          </div>
        </header>

        <section>
          <div class="section-label">Skills</div>
          <div class="skills-categories">${renderSkills(cv.skills)}</div>
        </section>

        <section>
          <div class="section-label">Experience</div>
          ${pinned.map(renderJob).join("")}
          ${earlier.length ? `
            <button class="earlier-toggle" onclick="toggleEarlier(this)">
              <span class="toggle-arrow">▶</span>
              Earlier experience (${earlier.length} roles)
            </button>
            <div class="earlier-cards">
              ${earlier.map(renderJob).join("")}
            </div>` : ""}
        </section>

        ${projects ? `
        <section>
          <div class="section-label">Projects</div>
          ${projects}
        </section>` : ""}

        <section>
          <div class="section-label">Languages</div>
          <div class="lang-grid">${languages}</div>
        </section>

        <div class="footer">
          <div class="api-badge">
            <span class="api-dot"></span>
            ${DATA_SOURCE_LABEL}
          </div>
          <div class="api-badge">${API}</div>
        </div>
      `;
    }

    function renderSkills(allSkills) {
        const weighted = [...allSkills].sort((a, b) => skillWeight(b) - skillWeight(a));
        return `
            <div class="skill-cloud">
                ${weighted.map(skill => `
                    <span class="skill-tag ${skillClass(skill)}">${skill}</span>
                `).join("")}
            </div>`;
    }

    function skillWeight(skill) {
        if (PRIMARY_SKILLS.includes(skill)) return 3;
        if (STRONG_SKILLS.includes(skill)) return 2;
        return 1;
    }

    function skillClass(skill) {
        if (PRIMARY_SKILLS.includes(skill)) return "primary-skill";
        if (STRONG_SKILLS.includes(skill)) return "strong-skill";
        return "supporting-skill";
    }

    function highlightNumbers(text) {
        return text.replace(/65%|60 → 20 minutes/g, m =>
            `<span class="highlight-number">${m}</span>`
        );
    }

    function toggleEarlier(btn) {
        btn.querySelector('.toggle-arrow').classList.toggle('open');
        btn.nextElementSibling.classList.toggle('open');
    }

    load();
  </script>
</body>
</html>
