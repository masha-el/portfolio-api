<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maria Elgart — Platform Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b10;
      --surface: #0d1117;
      --surface2: #111620;
      --border: #1c2333;
      --accent: #4fc3f7;
      --accent2: #00e5cc;
      --text: #c9d1d9;
      --text-dim: #586069;
      --text-bright: #f0f6fc;
      --red: #ff6b6b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79, 195, 247, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 195, 247, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    header {
      margin-bottom: 32px;
      animation: fadeUp 0.6s ease both;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .name-block h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 600;
      color: var(--text-bright);
      letter-spacing: -0.5px;
      line-height: 1.15;
      overflow: visible;
    }

    .name-block .title {
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
      font-weight: 500;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 229, 204, 0.06);
      border: 1px solid rgba(0, 229, 204, 0.2);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: var(--accent2);
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent2);
      border-radius: 50%;
      animation: pulse 2s ease infinite;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 0.78rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .contact-row span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .contact-row span::before {
      content: '▸';
      color: var(--accent);
      font-size: 0.6rem;
    }

    section {
      margin-bottom: 52px;
      animation: fadeUp 0.6s ease both;
    }

    section:nth-of-type(1) { animation-delay: 0.1s; }
    section:nth-of-type(2) { animation-delay: 0.2s; }
    section:nth-of-type(3) { animation-delay: 0.3s; }
    section:nth-of-type(4) { animation-delay: 0.4s; }

    .section-label {
      font-size: 0.65rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      transition: border-color 0.2s, background 0.2s;
      cursor: default;
    }

    .skill-tag:hover {
      border-color: var(--accent);
      background: rgba(79, 195, 247, 0.06);
    }

    .card {
      position: relative;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: #2a3550;
      transform: translateX(4px);
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      border-radius: 6px 0 0 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover::before { opacity: 1; }

    .job-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .job-role {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-bright);
    }

    .job-company {
      font-size: 0.75rem;
      color: var(--accent);
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .job-period {
      font-size: 0.7rem;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .highlights {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .highlights li {
      font-size: 0.78rem;
      color: var(--text-dim);
      padding-left: 16px;
      position: relative;
      line-height: 1.5;
    }

    .highlights li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--border);
    }

    .project-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-bright);
      margin-bottom: 12px;
    }

    .lang-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .lang-tag {
      font-size: 0.75rem;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 3px;
    }

    .footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .api-badge {
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .api-dot {
      width: 5px;
      height: 5px;
      background: var(--accent2);
      border-radius: 50%;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      color: var(--text-dim);
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .error-block {
      text-align: center;
      padding: 60px 20px;
      color: var(--red);
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="app">
      <div class="loading">
        <div class="spinner"></div>
        <span>FETCHING FROM API</span>
      </div>
    </div>
  </div>

  <script>
    const API = "https://api.elgart.tech/cv";

    async function load() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error();
        const cv = await res.json();
        render(cv);
      } catch {
        document.getElementById("app").innerHTML =
          `<div class="error-block">⚠ Could not reach API at ${API}</div>`;
      }
    }

    function render(cv) {
      const skills = cv.skills.map(s =>
        `<span class="skill-tag">${s}</span>`
      ).join("");

      const experience = cv.experience.map(job => `
        <div class="card">
          <div class="job-meta">
            <div>
              <div class="job-role">${job.role}</div>
              <div class="job-company">${job.company}</div>
            </div>
            <span class="job-period">${job.period}</span>
          </div>
          <ul class="highlights">
            ${job.highlights.map(h => `<li>${h}</li>`).join("")}
          </ul>
        </div>
      `).join("");

      const projects = (cv.projects || []).map(p => `
        <div class="card">
          <div class="project-name">${p.name}</div>
          <ul class="highlights">
            ${p.highlights.map(h => `<li>${h}</li>`).join("")}
          </ul>
        </div>
      `).join("");

      const languages = cv.languages.map(l =>
        `<span class="lang-tag">${l}</span>`
      ).join("");

      document.getElementById("app").innerHTML = `
        <header>
          <div class="header-top">
            <div class="name-block">
              <h1>${cv.name}</h1>
              <div class="title">${cv.title}</div>
            </div>
            <div class="status-badge">
              <span class="status-dot"></span>
              Open to opportunities
            </div>
          </div>
          <div class="contact-row">
            <span>${cv.contact.email}</span>
            <span>${cv.contact.phone}</span>
            <span>${cv.contact.location}</span>
          </div>
        </header>

        <section>
          <div class="section-label">Skills</div>
          <div class="skills-grid">${skills}</div>
        </section>

        <section>
          <div class="section-label">Experience</div>
          ${experience}
        </section>

        ${projects ? `
        <section>
          <div class="section-label">Projects</div>
          ${projects}
        </section>` : ""}

        <section>
          <div class="section-label">Languages</div>
          <div class="lang-grid">${languages}</div>
        </section>

        <div class="footer">
          <div class="api-badge">
            <span class="api-dot"></span>
            LIVE DATA · GKE · HELM
          </div>
          <div class="api-badge">${API}</div>
        </div>
      `;
    }

    load();
  </script>
</body>
</html>
