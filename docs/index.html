<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maria Elgart — Platform Engineer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080b10;
      --surface: #0d1117;
      --surface2: #111620;
      --border: #1c2333;
      --accent: #4fc3f7;
      --accent2: #00e5cc;
      --text: #dce3e8;
      --text-dim: #8b949e;
      --text-bright: #f0f6fc;
      --red: #ff6b6b;
      --highlight: #f0b429;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(79, 195, 247, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(79, 195, 247, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .highlight-number {
      color: var(--highlight);
      font-weight: 500;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    header {
      margin-bottom: 32px;
      animation: fadeUp 0.6s ease both;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .name-block h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 600;
      color: var(--text-bright);
      letter-spacing: -0.5px;
      line-height: 1.15;
      overflow: visible;
    }

    .name-block .title {
      font-size: 0.75rem;
      color: var(--accent);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
      font-weight: 500;
    }

    .name-block .positioning {
        font-size: 0.85rem;
        color: var(--text-dim);
        margin-top: 10px;
        line-height: 1.5;
        max-width: 480px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 229, 204, 0.06);
      border: 1px solid rgba(0, 229, 204, 0.2);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: var(--accent2);
      letter-spacing: 1px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent2);
      border-radius: 50%;
      animation: pulse 2s ease infinite;
    }

    .contact-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 0.78rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      padding-top: 20px;
    }

    .contact-row span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .contact-row span::before {
      content: '▸';
      color: var(--accent);
      font-size: 0.6rem;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;;
      cursor: pointer;
    }

    .cta-btn.primary {
        background: var(--accent);
        color: #080b10;
        border: 1px solid var(--accent);
        font-weight: 500;
    }

    .cta-btn.primary:hover { background: #81d4fa; border-color: #81d4fa; }

    .cta-btn.secondary {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
    }

    .cta-btn.secondary:hover { border-color: var(--accent); color: var(--accent); }

    section {
      margin-bottom: 52px;
      animation: fadeUp 0.6s ease both;
    }

    section:nth-of-type(1) { animation-delay: 0.1s; }
    section:nth-of-type(2) { animation-delay: 0.2s; }
    section:nth-of-type(3) { animation-delay: 0.3s; }
    section:nth-of-type(4) { animation-delay: 0.4s; }

    .section-label {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .skills-categories { display: flex; flex-direction: column; gap: 14px; }

    .skill-category { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    
    .skill-category-label {
        font-size: 0.65rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-dim);
        width: 110px;
        flex-shrink: 0;
        padding-right: 12px;
        border-right: 1px solid var(--border);
    }

    .skill-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 0.72rem;
      padding: 5px 12px;
      border-radius: 3px;
      letter-spacing: 0.5px;
      transition: border-color 0.2s, background 0.2s;
      cursor: default;
    }

    .skill-tag:hover {
      border-color: var(--accent);
      background: rgba(79, 195, 247, 0.06);
    }

    .card {
      position: relative;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 12px;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: #2a3550;
      transform: translateX(4px);
    }

    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--accent), transparent);
      border-radius: 6px 0 0 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .card:hover::before { opacity: 1; }

    .job-meta {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .job-role {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: var(--text-bright);
    }

    .job-company {
      font-size: 0.75rem;
      color: var(--accent);
      margin-top: 2px;
      letter-spacing: 0.5px;
    }

    .job-period {
      font-size: 0.7rem;
      color: var(--text-dim);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .highlights {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .highlights li {
      font-size: 0.78rem;
      color: var(--text-dim);
      padding-left: 16px;
      position: relative;
      line-height: 1.5;
    }

    .highlights li::before {
      content: '—';
      position: absolute;
      left: 0;
      color: var(--border);
    }

    .project-name {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-bright);
      margin-bottom: 12px;
    }

    .lang-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    .lang-tag {
      font-size: 0.75rem;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 16px;
      border-radius: 3px;
    }

    .footer {
      margin-top: 5px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .api-badge {
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .api-dot {
      width: 5px;
      height: 5px;
      background: var(--accent2);
      border-radius: 50%;
    }

    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      gap: 16px;
      color: var(--text-dim);
      font-size: 0.75rem;
      letter-spacing: 2px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .error-block {
      text-align: center;
      padding: 60px 20px;
      color: var(--red);
      font-size: 0.8rem;
      letter-spacing: 1px;
    }

    .earlier-toggle {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
        cursor: pointer;
        font-size: 0.72rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-dim);
        background: none;
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 10px 16px;
        width: 100%;
        text-align: left;
        transition: border-color 0.2s, color 0.2s;
        font-family: 'DM Mono', monospace;
    }

    .earlier-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .toggle-arrow { transition: transform 0.2s; font-size: 0.6rem; }
    .toggle-arrow.open { transform: rotate(90deg); }
    .earlier-cards { display: none; margin-top: 12px; }
    .earlier-cards.open { display: block; }

    .project-links { display: flex; gap: 12px; margin-bottom: 12px; }

    .project-link {
        font-size: 0.7rem;
        color: var(--accent);
        text-decoration: none;
        opacity: 0.8;
        transition: opacity 0.2s;
    }

    .project-link:hover { opacity: 1; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.8); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div id="app">
      <div class="loading">
        <div class="spinner"></div>
        <span>LOADING PORTFOLIO</span>
      </div>
    </div>
  </div>

  <script>
    const API = "./cv.json";
    const DATA_SOURCE_LABEL = API.startsWith("http")
      ? "DEVOPS DEMO · GKE · HELM"
      : "GITHUB PAGES · STATIC HOSTING";

    const SKILL_CATEGORIES = [
     { label: "Orchestration", skills: ["Kubernetes", "Helm", "ArgoCD", "GitOps", "Docker"] },
     { label: "Cloud",         skills: ["AWS", "GCP"] },
     { label: "IaC & CI/CD",   skills: ["Terraform", "Terragrunt", "CI/CD", "Jenkins"] },
     { label: "Observability", skills: ["Grafana"] },
     { label: "Scripting",     skills: ["Python", "Bash"] },
     { label: "Security",      skills: ["Twingate", "ESET"] },
    ];

    const PROJECT_LINKS = {
        "FamilyBot": "https://github.com/masha-el/family-bot",
        "Corti":     "https://github.com/masha-el/corti-bot",
    };

    async function load() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error();
        const cv = await res.json();
        render(cv);
      } catch {
        document.getElementById("app").innerHTML =
          `<div class="error-block">⚠ Could not reach API at ${API}</div>`;
      }
    }

    function renderJob(job) {
      return `
        <div class="card">
          <div class="job-meta">
            <div>
              <div class="job-role">${job.role}</div>
              <div class="job-company">${job.company}</div>
            </div>
            <span class="job-period">${job.period}</span>
          </div>
          <ul class="highlights">
            ${job.highlights.map(h => `<li>${highlightNumbers(h)}</li>`).join("")}
          </ul>
        </div>`;
    }

    function render(cv) {
      const pinned  = cv.experience.slice(0, 3);
      const earlier = cv.experience.slice(3);

      const projects = (cv.projects || []).map(p =>{
        const linkKey = Object.keys(PROJECT_LINKS).find(k => p.name.includes(k));
        const githubLink = linkKey
            ? `<a class="project-link" href="${PROJECT_LINKS[linkKey]}" target="_blank">GitHub</a>`
            : "";
            return `
              <div class="card">
                <div class="project-name">${p.name}</div>
                <div class="project-links">${githubLink}</div>
                <ul class="highlights">
                  ${p.highlights.map(h => `<li>${h}</li>`).join("")}
                </ul>
              </div>`;
    }).join("");

      const languages = cv.languages.map(l =>
        `<span class="lang-tag">${l}</span>`
      ).join("");

      document.getElementById("app").innerHTML = `
        <header>
          <div class="header-top">
            <div class="name-block">
              <h1>${cv.name}</h1>
              <div class="title">${cv.title}</div>
              <div class="positioning">I build and operate the infrastructure that lets engineering teams ship faster.</div>
            </div>
            <div class="status-badge">
              <span class="status-dot"></span>
              Open to opportunities
            </div>
          </div>
          <div class="contact-row">
            <span>${cv.contact.email}</span>
            <span>${cv.contact.phone}</span>
            <span>${cv.contact.location}</span>
          </div>
          <div class="cta-row">
            <a class="cta-btn primary" href="mailto:${cv.contact.email}">Contact me</a>
            <a class="cta-btn secondary" href="https://www.linkedin.com/in/mashaelgart" target="_blank">LinkedIn</a>
            <a class="cta-btn secondary" href="https://github.com/masha-el" target="_blank">GitHub</a>
          </div>
        </header>

        <section>
          <div class="section-label">Skills</div>
          <div class="skills-categories">${renderSkills(cv.skills)}</div>
        </section>

        <section>
          <div class="section-label">Experience</div>
          ${pinned.map(renderJob).join("")}
          ${earlier.length ? `
            <button class="earlier-toggle" onclick="toggleEarlier(this)">
              <span class="toggle-arrow">▶</span>
              Earlier experience (${earlier.length} roles)
            </button>
            <div class="earlier-cards">
              ${earlier.map(renderJob).join("")}
            </div>` : ""}
        </section>

        ${projects ? `
        <section>
          <div class="section-label">Projects</div>
          ${projects}
        </section>` : ""}

        <section>
          <div class="section-label">Languages</div>
          <div class="lang-grid">${languages}</div>
        </section>

        <div class="footer">
          <div class="api-badge">
            <span class="api-dot"></span>
            ${DATA_SOURCE_LABEL}
          </div>
          <div class="api-badge">${API}</div>
        </div>
      `;
    }

    function renderSkills(allSkills) {
        return SKILL_CATEGORIES.map(cat => {
            const matched = cat.skills.filter(s => allSkills.includes(s));
            if (!matched.length) return "";
            return `
                <div class="skill-category">
                    <span class="skill-category-label">${cat.label}</span>
                    ${matched.map(s => `<span class="skill-tag">${s}</span>`).join("")}
                </div>`;
        }).join("");
    }

    function highlightNumbers(text) {
        return text.replace(/65%|60 → 20 minutes/g, m =>
            `<span class="highlight-number">${m}</span>`
        );
    }

    function toggleEarlier(btn) {
        btn.querySelector('.toggle-arrow').classList.toggle('open');
        btn.nextElementSibling.classList.toggle('open');
    }

    load();
  </script>
</body>
</html>
