<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Maria Elgart — DevOps Engineer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      border-bottom: 1px solid #333;
      padding-bottom: 20px;
      margin-bottom: 30px;
    }

    h1 { font-size: 2rem; color: #fff; }
    h2 { font-size: 1rem; color: #888; margin-top: 4px; }

    .contact {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #666;
    }

    section {
      margin-bottom: 30px;
    }

    section h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #555;
      margin-bottom: 12px;
    }

    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill {
      background: #1e2130;
      border: 1px solid #2a2f45;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.85rem;
      color: #a0c4ff;
    }

    .job {
      margin-bottom: 20px;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .job-title {
      font-weight: 600;
      color: #fff;
    }

    .job-period {
      font-size: 0.8rem;
      color: #555;
    }

    .job-company {
      font-size: 0.85rem;
      color: #a0c4ff;
      margin-bottom: 6px;
    }

    .job ul {
      padding-left: 16px;
    }

    .job li {
      font-size: 0.875rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .languages {
      display: flex;
      gap: 12px;
      font-size: 0.875rem;
      color: #aaa;
    }

    #status {
      font-size: 0.75rem;
      color: #444;
      margin-top: 40px;
      text-align: center;
    }

    .error { color: #ff6b6b; text-align: center; padding: 40px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="content">Loading...</div>
    <div id="status"></div>
  </div>

  <script>
    const API = "http://34.165.102.32/cv";

    async function load() {
      try {
        const res = await fetch(API);
        const cv = await res.json();
        render(cv);
        document.getElementById("status").textContent = "Served live from GKE via Helm";
      } catch (e) {
        document.getElementById("content").innerHTML =
          '<p class="error">Could not reach API.</p>';
      }
    }

    function render(cv) {
      const experience = cv.experience.map(job => `
        <div class="job">
          <div class="job-header">
            <span class="job-title">${job.role}</span>
            <span class="job-period">${job.period}</span>
          </div>
          <div class="job-company">${job.company}</div>
          <ul>${job.highlights.map(h => `<li>${h}</li>`).join("")}</ul>
        </div>
      `).join("");

      const skills = cv.skills.map(s =>
        `<span class="skill">${s}</span>`
      ).join("");

      const languages = cv.languages.map(l =>
        `<span>${l}</span>`
      ).join("");

      document.getElementById("content").innerHTML = `
        <header>
          <h1>${cv.name}</h1>
          <h2>${cv.title}</h2>
          <div class="contact">
            ${cv.contact.email} · ${cv.contact.phone} · ${cv.contact.location}
          </div>
        </header>

        <section>
          <h3>Skills</h3>
          <div class="skills">${skills}</div>
        </section>

        <section>
          <h3>Experience</h3>
          ${experience}
        </section>

        <section>
          <h3>Languages</h3>
          <div class="languages">${languages}</div>
        </section>
      `;
    }

    load();
  </script>
</body>
</html>
